# Merge/PR gate: run the same test gate as local development on every push to
# master and every pull request targeting master, on both Linux and Windows.
#
# test:gate = lint + git diff --check + vitest + mobile-remote node:test suites.
# Windows-only assertions are runIf-gated and run for real on windows-latest;
# build-artifact assertions stay skipped (only enforced with
# CODEBUDDY_REQUIRE_BUILD=1 inside the release workflow's full build).
#
# Supply-chain hardening: third-party actions are pinned to full commit SHAs
# (not floating tags) so a compromised tag cannot silently change what runs
# here. When bumping, resolve the new tag's commit SHA and update both the SHA
# and the trailing version comment.

name: ci

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test gate
        run: npm run test:gate
