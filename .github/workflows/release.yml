# Release pipeline: builds the Windows installer and attaches it to a DRAFT
# GitHub Release. A human reviews the draft and publishes it manually.
#
# Triggers:
#   - push of a v* tag (the normal path: merge to master, then tag)
#   - workflow_dispatch with an EXISTING tag name (recovery path: a tag such as
#     v1.1.1 already exists without a Release; this builds from that tag and
#     drafts the Release for it). Note: workflow_dispatch is only available
#     once this file is on the default branch.
#
# Code signing:
#   The official pipeline (scripts/prepare-release.ps1) enforces a valid,
#   non-self-signed Authenticode signature. CI cannot sign without the CSC_LINK
#   and CSC_KEY_PASSWORD repository secrets (electron-builder reads them to
#   sign the installer). When CSC_LINK is absent, the build runs with
#   -AllowUnsigned so the workflow still produces a reviewable draft; the
#   release notes generated by prepare-release.ps1 then carry the explicit
#   "signature unavailable" warning + SHA256 for manual verification.
#   To ship a SIGNED release: add CSC_LINK / CSC_KEY_PASSWORD secrets
#   (Settings -> Secrets and variables -> Actions) and re-run this workflow.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build a draft release for (e.g. v1.1.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          $tag = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.tag }}'
          } else {
            '${{ github.ref_name }}'
          }
          if ($tag -notmatch '^v\d+\.\d+\.\d+') { throw "Not a release tag: $tag" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $expected = 'v' + $version
          if ('${{ steps.tag.outputs.tag }}' -ne $expected) {
            throw "Tag ${{ steps.tag.outputs.tag }} does not match package.json version $version"
          }

      # Same gate as local development: lint + git diff --check + vitest +
      # mobile-remote node:test suites. Windows-only assertions are runIf-gated
      # and run for real here; build-artifact assertions are skipped until the
      # build below (they are only enforced with CODEBUDDY_REQUIRE_BUILD=1).
      - name: Test gate
        run: npm run test:gate

      # prepare-release.ps1 runs `npm run build` itself, then validates the
      # installer + blockmap + latest.yml, writes dist/SHA256SUMS.txt and the
      # release-notes body. Signing is attempted only when CSC secrets exist;
      # see the header comment.
      - name: Build installer and release assets
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:CSC_LINK)) {
            Write-Host 'CSC_LINK secret not configured -> building UNSIGNED preview installer (-AllowUnsigned).'
            # electron-builder treats an EMPTY CSC_LINK env var as "certificate
            # provided" and fails resolving it; drop the empty vars entirely.
            Remove-Item Env:\CSC_LINK -ErrorAction SilentlyContinue
            Remove-Item Env:\CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
            node scripts/run-release.cjs -AllowUnsigned
          } else {
            node scripts/run-release.cjs
          }

      - name: Locate release notes body
        id: notes
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "path=dist/release-notes-v$version.md" >> $env:GITHUB_OUTPUT

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: CodeBuddy Desktop ${{ steps.tag.outputs.tag }}
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            dist/CodeBuddy-GUI-Setup-*.exe
            dist/CodeBuddy-GUI-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt

      # Keep the assets around even if the draft-release step needs a retry.
      - name: Upload artifacts (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ steps.tag.outputs.tag }}
          path: |
            dist/CodeBuddy-GUI-Setup-*.exe
            dist/CodeBuddy-GUI-Setup-*.exe.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
            dist/release-notes-*.md
          if-no-files-found: error
